name: Build & Deploy to ECS Fargate

on:
  push:
    branches:
      - main        # → production
      - staging     # → staging
      - develop     # → development
  pull_request:
    branches:
      - main
      - staging

# Prevent concurrent deployments to the same environment
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1

# ── Branch → Environment mapping ──────────────────────────────
# main     → production
# staging  → staging
# develop  → development

jobs:
  # ────────────────────────────────────────────────────────────
  # JOB 1 – Resolve environment name from branch
  # ────────────────────────────────────────────────────────────
  resolve-env:
    name: Resolve Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.map.outputs.environment }}
      should_deploy: ${{ steps.map.outputs.should_deploy }}
    steps:
      - name: Map branch to environment
        id: map
        run: |
          case "${{ github.ref_name }}" in
            main)    echo "environment=production"  >> $GITHUB_OUTPUT; echo "should_deploy=true"  >> $GITHUB_OUTPUT ;;
            staging) echo "environment=staging"     >> $GITHUB_OUTPUT; echo "should_deploy=true"  >> $GITHUB_OUTPUT ;;
            develop) echo "environment=development" >> $GITHUB_OUTPUT; echo "should_deploy=true"  >> $GITHUB_OUTPUT ;;
            *)       echo "environment=none"        >> $GITHUB_OUTPUT; echo "should_deploy=false" >> $GITHUB_OUTPUT ;;
          esac

  # ────────────────────────────────────────────────────────────
  # JOB 2 – Test
  # ────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --if-present

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: app/coverage
          retention-days: 7

  # ────────────────────────────────────────────────────────────
  # JOB 3 – Build & push Docker image to ECR
  # ────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: [resolve-env, test]
    if: needs.resolve-env.outputs.should_deploy == 'true' && github.event_name == 'push'
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      ecr_repo:  ${{ steps.ecr.outputs.repo_url }}

    steps:
      - uses: actions/checkout@v4

      # ── Authenticate to AWS using long-lived access keys ────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      # ── Log in to Amazon ECR ─────────────────────────────
      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ── Derive image tag & ECR URL ───────────────────────
      - name: Image metadata
        id: meta
        env:
          ENV: ${{ needs.resolve-env.outputs.environment }}
        run: |
          PROJECT_NAME="${{ vars.PROJECT_NAME || 'myapp' }}"
          ECR_REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          REPO_URL="${ECR_REGISTRY}/${PROJECT_NAME}-${ENV}"
          SHORT_SHA="${GITHUB_SHA::8}"
          IMAGE_TAG="${SHORT_SHA}"
          echo "image_tag=${IMAGE_TAG}"   >> $GITHUB_OUTPUT
          echo "repo_url=${REPO_URL}"     >> $GITHUB_OUTPUT

      - name: Set ECR repo output
        id: ecr
        run: echo "repo_url=${{ steps.meta.outputs.repo_url }}" >> $GITHUB_OUTPUT

      # ── Set up Docker Buildx ─────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Build & push ─────────────────────────────────────
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context:   ./app
          file:      ./app/Dockerfile
          platforms: linux/amd64
          push:      true
          tags: |
            ${{ steps.meta.outputs.repo_url }}:${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.repo_url }}:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.image_tag }}

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ steps.meta.outputs.repo_url }}:${{ steps.meta.outputs.image_tag }}"
          format:    table
          exit-code: 0           # warn only; set to 1 to block on HIGH/CRITICAL
          severity:  HIGH,CRITICAL

  # ────────────────────────────────────────────────────────────
  # JOB 4 – Deploy to ECS
  # ────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to ECS (${{ needs.resolve-env.outputs.environment }})
    runs-on: ubuntu-latest
    needs: [resolve-env, build-and-push]
    environment: ${{ needs.resolve-env.outputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ── Resolve resource names ────────────────────────────
      - name: Set deployment variables
        id: vars
        env:
          ENV: ${{ needs.resolve-env.outputs.environment }}
        run: |
          PROJECT="${{ vars.PROJECT_NAME || 'myapp' }}"
          NAME_PREFIX="${PROJECT}-${ENV}"
          echo "cluster=${NAME_PREFIX}"              >> $GITHUB_OUTPUT
          echo "service=${NAME_PREFIX}"              >> $GITHUB_OUTPUT
          echo "task_family=${NAME_PREFIX}"          >> $GITHUB_OUTPUT
          echo "container_name=${PROJECT}"           >> $GITHUB_OUTPUT
          IMAGE="${{ needs.build-and-push.outputs.ecr_repo }}:${{ needs.build-and-push.outputs.image_tag }}"
          echo "image=${IMAGE}"                      >> $GITHUB_OUTPUT

      # ── Download current task definition ─────────────────
      - name: Download task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ steps.vars.outputs.task_family }} \
            --query taskDefinition \
            > task-definition.json

      # ── Inject new image into task definition ─────────────
      - name: Render new task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition:  task-definition.json
          container-name:   ${{ steps.vars.outputs.container_name }}
          image:            ${{ steps.vars.outputs.image }}

      # ── Deploy ───────────────────────────────────────────
      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition:            ${{ steps.task-def.outputs.task-definition }}
          service:                    ${{ steps.vars.outputs.service }}
          cluster:                    ${{ steps.vars.outputs.cluster }}
          wait-for-service-stability: true
          force-new-deployment:       true

      # ── Smoke test ───────────────────────────────────────
      - name: Smoke test
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --names "${{ steps.vars.outputs.cluster }}-alb" \
            --query 'LoadBalancers[0].DNSName' \
            --output text)
          echo "Testing http://${ALB_DNS}/health ..."
          for i in {1..5}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://${ALB_DNS}/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Health check passed (HTTP $STATUS)"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS – retrying in 10s..."
            sleep 10
          done
          echo "❌ Health check failed after 5 attempts"
          exit 1

      - name: Deployment summary
        if: success()
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --names "${{ steps.vars.outputs.cluster }}-alb" \
            --query 'LoadBalancers[0].DNSName' \
            --output text)
          echo "### 🚀 Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | ${{ needs.resolve-env.outputs.environment }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Image tag   | ${{ needs.build-and-push.outputs.image_tag }} |" >> $GITHUB_STEP_SUMMARY
          echo "| App URL     | http://${ALB_DNS} |" >> $GITHUB_STEP_SUMMARY
